name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Install Android Workload
        run: dotnet workload install android

      - name: Restore Dependencies
        run: dotnet restore GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj

      - name: Build APK
        run: dotnet build GalaxyBudsClient.Android/GalaxyBudsClient.Android.csproj -c Debug -p:AndroidPackageFormat=apk -p:TreatWarningsAsErrors=false -p:NoWarn="NU1901;NU1902;NU1903;NU1904;NU1905"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GalaxyBudsClient-APK
          path: '**/*.apk'
          
